; Workshop 2026-27 / M2 - Module IoT ESP8266 (LED bicolore rouge/vert)
; Ouvrir ce dossier dans CLion (plugin PlatformIO) : le projet est detecte automatiquement.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp8266_exception_decoder, time

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -Wall

# Prometheus collecte les métriques des services toutes les 5 s.
# C'est la source principale du détecteur d'anomalies.

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]       # métriques de l'API de paiement

  - job_name: detector
    static_configs:
      - targets: ["detector:8000"]  # gauges aiops_* du détecteur IA

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]  # CPU/mémoire des conteneurs

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

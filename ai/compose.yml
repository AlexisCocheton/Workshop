# Partie IA de RESILIENCE-ALPHA.
# À inclure depuis le docker-compose principal de l'équipe :
#   include:
#     - ai/compose.yml
# Les ports ne sont publiés que sur 127.0.0.1 : rien n'est exposé au réseau du groupe.

services:
  detector:
    build: .
    command: uvicorn detector.service:app --host 0.0.0.0 --port 8000
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      REMEDIATION_URL: ${REMEDIATION_URL:-http://remediation:8200/incident}
      REMEDIATION_TOKEN: ${REMEDIATION_TOKEN:-dev-token}  # fourni par Vault/SOPS en vrai
    volumes:
      - ./data:/app/data  # CSV collectés + modèle entraîné
    ports:
      - "127.0.0.1:8000:8000"

  assistant:
    build: .
    command: uvicorn assistant.service:app --host 0.0.0.0 --port 8001
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}  # ou l'IP du PC de délestage IA
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      DETECTOR_URL: http://detector:8000
    volumes:
      - ./docs:/app/docs:ro  # l'assistant lit la documentation, sans pouvoir la modifier
    ports:
      - "127.0.0.1:8001:8001"

  ollama:
    image: ollama/ollama:0.35.1
    volumes:
      - ollama:/root/.ollama  # modèles téléchargés, conservés entre deux redémarrages

volumes:
  ollama:

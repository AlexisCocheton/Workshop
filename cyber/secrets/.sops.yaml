# Règles SOPS : chiffre toute valeur du fichier .env avant de le versionner.
# Remplacer la clé age ci-dessous par celle de l'équipe (générée avec `age-keygen`).
# La clé privée reste hors du dépôt (ne jamais la committer).

creation_rules:
  - path_regex: \.env$
    age: age1exemple0remplacerparlaclefpubliquedelequipe00000000000000000

; Témoin LED du back-office (consigne additionnelle 1) : NodeMCU ESP8266 + LED bicolore.
; Ouvrir ce dossier dans CLion (plugin PlatformIO), ou en ligne de commande :
;   pio run -t upload      compiler et téléverser
;   pio device monitor     journal série (connexion WiFi, erreurs)

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
